id: 12-invest
title: "Invest \u2014 Authenticated overlay dashboard and nightly research pipeline"
audience: Anyone checking investment-data freshness, the dashboard path, or the nightly pipeline.
layer: C
summary: 'The dashboard reads a privacy-safe DuckDB projection. A system timer runs the authoritative 17-stage research pipeline; bounded model stages run only after deterministic filtering.

  '
notes:
- "I open the investment dashboard from the laptop through the authenticated /invest route. The gateway forwards the request to Streamlit. Streamlit reads a separate DuckDB projection, so browsing charts and tables cannot modify the pipeline\u2019s working database."
- The nightly timer starts one locked pipeline run. The first stages refresh mutual-fund data, calculate metrics, write exports to the synchronized workspace, and prepare alerts. Later stages collect prices and filings, update fundamentals, apply deterministic screens, and build the watchlist.
- Only the survivors reach bounded model research and headline sentiment. Those calls add context to a filtered set instead of asking a model to inspect every record. The final stages update tracking, produce the Telegram digest, and rank the current candidates.
- The last stage creates a temporary read-only UI database, checks it, and atomically replaces the previous projection. If an optional feed fails, the pipeline keeps the last usable data and marks freshness or missing sections. The dashboard therefore shows a stable result rather than a half-written run.
- I use Telegram for change alerts and the compact digest. I use the Streamlit dashboard when I want to inspect the underlying metrics and rankings. The system is research-only and has no broker order path.
