id: 07-storage
title: "Storage \u2014 Syncthing as the hub, and who reads what"
audience: Anyone moving data, planning the rebuild, or about to write into the workspace.
layer: B
summary: Shared folders, application state, and read-only consumer relationships across the homelab.
notes:
- Syncthing is the bridge between the laptop, phone, and server. I use its web dashboard to check peers and folder health. The Obsidian workspace and selected libraries synchronize between devices, while wearable exports use a one-way phone-to-server pattern.
- The shared music folder has several roles. Lidarr and Musicportal write it. Navidrome reads it for playback. Syncthing copies it to my devices. The arrows show permissions because write access matters more than the implementation path here.
- The video libraries are different. Jellyfin reads both the server-managed movie and television folders and a separate folder synchronized from the laptop. The book folder feeds Kavita, while Immich uses its own upload, database, and model-cache storage.
- The workspace is where Obsidian notes and agent-readable project context live. MCP tools expose controlled search, reading, append, and create operations. Agents do not receive unrestricted filesystem access.
- The health importers validate phone exports and publish stable snapshots. Grafana mounts those snapshots read-only. This keeps a dashboard query from changing the source health records.
- 'I use this page to answer two practical questions before changing anything: which service writes this folder, and which devices or applications will see the result.'
