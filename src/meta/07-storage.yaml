id: 07-storage
title: Local storage and backup flow
audience: Homelab operators and reviewers
summary: Synthetic topology that demonstrates local storage plus an authoritative-workstation sync pattern with an editable hub replica and a receive-only mobile replica. It publishes no host-specific addresses, paths, or account data.
