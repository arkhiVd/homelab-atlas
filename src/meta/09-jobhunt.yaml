id: 09-jobhunt
title: "jobhunt \u2014 discovery, bounded scoring, and user actions"
audience: Anyone changing a source, filter, model selection, notification, or board output.
layer: C
summary: 'A persistent timer runs discovery, normalization, deduplication, deterministic filtering, bounded model scoring through Hermes, notifications, and board generation. SQLite remains the canonical job store; the workspace contains generated user-facing outputs.

  '
notes:
- A persistent system timer starts discovery each day, even if the machine was asleep at the nominal time. The discovery service reads the configured job boards and APIs, converts their different responses into one shape, deduplicates repeated listings, and stores jobs in SQLite.
- Cheap deterministic rules run before any model call. Clear mismatches are recorded and stop there. Plausible and uncertain roles continue to bounded model scoring. This keeps cost and runtime controlled and leaves failed model calls available for a later retry.
- Hermes selects the configured provider and model for scoring and bot conversations. The canonical resume gives the scorer the experience it should compare against. Provider output adds a score and explanation, but it does not submit an application.
- I use Telegram for the digest and quick actions. The bot can show a job, prepare tailored material, and change its model. The workspace kanban is the longer review view. SQLite remains the source of truth for status.
- The human gate is deliberate. The workflow finds, sorts, and prepares work. I decide what to shortlist, what material to use, and whether to apply. No recruiter message or application is sent automatically.
