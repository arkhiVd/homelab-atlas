id: 11-automation
title: "Automation \u2014 every unit, every timer, and where it reports"
audience: Anyone debugging a job that did not run, or wondering what changed the box overnight.
layer: C
summary: 'Boot order, always-on services, user-scope units, and recurring timers. The health pipeline adds a path-triggered Gadgetbridge promoter, a fallback promotion timer, a Health Connect receiver, and a daily consistent backup.

  '
notes:
- At boot, the overlay service and Docker start before homelab.service brings up the Compose projects. The user service manager separately starts Hermes Gateway, Claude Bridge, and CloudOps Chat. This split lets container applications and user-owned AI processes have different permissions and restart policies.
- "The CLI update timer runs each day. Its service updates tools managed by mise, updates Hermes through Hermes\u2019s own updater, restarts the affected agent services, verifies them, and sends a Telegram message if a step fails. The result is one checked update run rather than several unrelated background updaters."
- The custom-image timer rebuilds Musicportal and Bookportal each week so their application images pick up current source and base-image changes. Watchtower handles published container-image updates on its own weekly schedule. These jobs are separate because locally built images and registry images need different update methods.
- The staged reboot timer checks each morning. It records the need for a reboot first and performs it on the following run, leaving time to cancel. The dependency checker runs weekly and reports stale image or base references before they become surprise breakage.
- Application timers run the daily job discovery, health snapshot promotion, health database backup, and nightly investment research. Each timer starts a short-lived service, and that service exits when the work is complete. An inactive oneshot is usually waiting for its next timer, not broken.
- Uptime Kuma watches important endpoints and Telegram receives failure reports. Swap, earlyoom, and container memory limits reduce the chance that one workload makes the whole host unusable.
