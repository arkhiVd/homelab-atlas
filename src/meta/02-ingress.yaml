id: 02-ingress
title: "Ingress \u2014 current access paths and the auth hop"
audience: Anyone publishing a port, debugging a 302 to /login.html, or assessing exposure.
layer: A
summary: 'Current access is through device-authenticated Authenticated overlay or a small set of deliberate direct listeners. Also documents the container-to-host seam: nginx in the cloudops container calls back to a host process on the Docker gateway IP for auth and chat.'
notes:
- From the laptop or phone, I first connect through the authenticated overlay. The HTTPS router then maps friendly paths to Homepage, the atlas, Grafana, the investment dashboard, and the Health Connect receiver. Funnel is off, so those routes are not public web entry points.
- Homepage is my starting dashboard. It links to the applications I use regularly. The atlas explains how they fit together. Grafana shows wearable data, and the investment path opens the read-only Streamlit dashboard.
- CloudOps has its own login check. Nginx asks the CloudOps Chat service whether the browser session is valid before serving the site or proxying an API request. The browser never calls the internal chat process directly.
- The MCP endpoint is for configured AI clients rather than a browser dashboard. Clients authenticate, then call a limited set of workspace, job-search, training, and read-only operations tools.
- SSH, remote-desktop relay traffic, and Soulseek are protocols rather than browser dashboards. They take the direct protocol path shown separately from the HTTPS application routes.
