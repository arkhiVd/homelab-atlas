id: 06-books-photos
title: "Books and photos \u2014 two small self-contained stacks"
audience: Anyone touching bookportal's proxy path or the Immich four-container set.
layer: B
summary: 'Books: the custom bookportal fetches from Libgen directly and from Anna''s Archive through a dedicated ProtonVPN HTTP proxy, normalises filenames into ./data/books, and Kavita serves them. Photos: immich-server with its Postgres+pgvector database, Redis job queue, and a separate machine-learning container for CLIP search and face detection.

  '
notes:
- For books, I open Bookportal in a browser and search from one page. Bookportal is a custom FastAPI service. It queries the configured sources, sends the source that needs a proxy through the dedicated ProtonVPN container, normalizes the downloaded filename, and saves the result in the book folder.
- Kavita reads that folder and is the browser-based reader and library dashboard. Bookportal acquires and organizes files. Kavita catalogs and presents them. Keeping those jobs separate makes each service easier to replace or troubleshoot.
- For photos, the Immich app on the phone uploads to Immich Server. The server stores original files in the upload area and metadata in PostgreSQL. Redis holds background jobs, and the machine-learning container produces search embeddings and face-detection results.
- I use the Immich phone app and web dashboard to browse, search, and back up photos. A usable restore needs both the uploaded files and the database because the files alone do not contain albums, jobs, and application metadata.
- The books and photos stacks share the host but not a workflow. They appear together because each is a small, self-contained service group with a clear user-facing app and its own durable storage.
