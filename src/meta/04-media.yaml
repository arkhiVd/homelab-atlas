id: 04-media
title: "Media pipeline \u2014 request to playback"
audience: Anyone debugging why a download stalled, imported to the wrong place, or never appeared in Jellyfin.
layer: B
summary: 'The full path a movie or episode takes: jellyseerr request, radarr/sonarr management, prowlarr search, qbittorrent fetch through the WARP tunnel, unpackerr extraction, import to ./data/media, then jellyfin playback with bazarr subtitles and tdarr transcode.

  '
notes:
- I open Jellyseerr in a browser when I want to request a film or series. Jellyseerr sends movie requests to Radarr and television requests to Sonarr, so I do not have to operate each manager for a normal request.
- Radarr and Sonarr ask Prowlarr to search the configured indexers. Prowlarr can use FlareSolverr when a source requires a browser-style challenge. A selected result is passed to qBittorrent.
- "qBittorrent shares Gluetun\u2019s network and therefore uses the WARP egress path. Completed files land in the download area. Unpackerr extracts archives, then Radarr or Sonarr imports and names the result in the movie or television library."
- Jellyfin reads the finished libraries and is the dashboard and app I use for playback. Bazarr adds subtitles. Tdarr is available for server-side media processing. A second Jellyfin library comes from files synchronized from the laptop.
- Decluttarr cleans stalled download-manager entries. It is housekeeping, not part of a successful request. The normal result of the workflow is a named file in the correct library that appears in Jellyfin.
