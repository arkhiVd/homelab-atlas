id: 08-ai-plane
title: "Agent workflow \u2014 Pi, Hermes, providers, and homelab-mcp"
audience: Anyone changing an agent path, credential/config routing, or a guarded MCP operation.
layer: C
summary: 'Pi calls its configured OpenAI Codex provider directly, while the Hermes gateway and Jobhunt use Hermes-selected provider routes. CloudOps Chat invokes its selected provider or local CLI itself and uses Hermes for catalog data. homelab-mcp remains authenticated overlay-only. Herdr is a local workflow CLI, while agent-workbench is public reference material, not a deployed service.

  '
notes:
- I normally start AI coding work from Pi on the laptop. Pi reads the repository AGENTS.md, project documents, and installed skills before it edits code. For homelab projects the project-dev skill sets the change class, required checks, review gate, and the rule that an agent cannot restart a service without permission.
- The unslop skill is the final writing pass. It removes stock AI wording and rewrites explanations in plain language without changing technical meaning. Other task-specific instructions can come from the repository or the synchronized Obsidian workspace.
- Pi calls its configured Codex provider directly. Hermes is a separate router used by the Telegram gateway and Jobhunt. CloudOps Chat can call a hosted provider, Claude CLI, or Codex CLI. The credential stores authorize those calls, but credentials never enter the instruction files or diagrams.
- Herdr coordinates work when several agents need bounded tasks. Pi reports session state to Herdr, and the coordinator assigns non-overlapping work. I still review the combined diff and control commits, deployment, and merge.
- homelab-mcp is the controlled bridge from AI clients to homelab information. Its workspace tools search and read notes, append approved content, and create notes only in allowed folders. Jobhunt and Dojo tools return bounded database views. Operations tools expose selected health and log reads.
- Every MCP tool call is logged with the caller, tool, and outcome. Writes are serialized. A guard refusal is a result to report, not something the agent should work around.
- 'agent-workbench is the public explanation of this workflow. It documents the loop I use: understand the task, decide the boundary, write the contract, implement one reviewable slice, run real checks, review the diff, and record durable decisions.'
