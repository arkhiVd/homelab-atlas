id: 03-containers
title: "Container map \u2014 running containers grouped by purpose"
audience: The reference view. Answers 'what is this container and what port is it on'.
layer: B
summary: Running containers grouped by function, with published ports. RustDesk and Syncthing appear under Platform because they use host networking.
notes:
- I use Homepage as the front page and Uptime Kuma to see whether important endpoints respond. CloudOps is a study and operations interface. Grafana is the dashboard for wearable data. Each front end connects to a smaller set of backend services shown by the arrows.
- The video workflow starts in Jellyseerr. Movie requests go to Radarr and series requests go to Sonarr. Both use Prowlarr for search and send downloads to qBittorrent through Gluetun. Unpackerr extracts completed downloads. Jellyfin plays the resulting library, while Bazarr manages subtitles and Tdarr handles planned transcode work.
- 'The music workflow has two inputs. Lidarr, Soularr, and slskd cooperate on wanted music. Musicportal is a custom service for JioSaavn searches and downloads. Navidrome reads the shared music library for playback. Librarian is my controlled cleanup tool: it previews a deletion plan, requires typed confirmation, removes files, and updates the relevant library manager.'
- Bookportal is a custom FastAPI search and download interface. It writes normalized files into the book library, and Kavita is the reader. Immich handles phone photo backup. Its server uses PostgreSQL for metadata, Redis for jobs, and a machine-learning worker for search and face features.
- Miniflux is the RSS reader and stores subscriptions in PostgreSQL. Wger is the fitness application. Its web process, worker, scheduler, sync process, database, cache, and Nginx entry point form one application even though they run as separate containers.
- Watchtower checks container images on its weekly schedule. Syncthing handles device replication. The RustDesk relay supports remote access. These platform containers are separate from the application request chains.
