[project]
name = "homelab-atlas"
version = "0.1.0"
description = "Hand-authored Mermaid diagrams with machine-checkable infrastructure sidecars"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
